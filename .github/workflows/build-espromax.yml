
name: ESPROMAX V2 - signer APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release contenant l'APK"
        required: true
        default: "source-v2"

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: 'platform-tools'

     
      - name: Installer les outils Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "build-tools;35.0.0"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
